name: Build AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build SwitchTools.AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl git make python3 python3-venv \
            p7zip-full squashfs-tools \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build tools
        run: bash scripts/build-tools.sh

      - name: Build app (release)
        run: cd src-tauri && cargo build --release

      - name: Build AppImage
        run: bash scripts/make-appimage.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwitchTools.AppImage
          path: SwitchTools.AppImage
          if-no-files-found: error

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SwitchTools.AppImage
          generate_release_notes: true